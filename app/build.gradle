plugins {
    id 'com.android.application'
}

android {
    namespace 'de.fachteilluchs.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.fachteilluchs.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
