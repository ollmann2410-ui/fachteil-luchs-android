name: Build Fachteil-Luchs APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: V2.6.0 App, Inhalte und Trainer technisch pruefen
        shell: bash
        run: |
          for js in app/src/main/assets/*.js; do
            node --check "$js"
          done

          node <<'NODE'
          const fs=require('fs');
          global.window=global;

          // Echte Basisdaten direkt aus index.html lesen.
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          const match=html.match(/const AREAS=(\{[\s\S]*?\});\s*let currentArea=/);
          if(!match) throw new Error('AREAS-Basisdaten in index.html nicht gefunden.');

          global.AREAS=JSON.parse(match[1]);
          Object.entries(AREAS).forEach(([area,data])=>{
            data.cards.forEach(card=>card._area=area);
          });

          global.ALL_CARDS=Object.values(AREAS).flatMap(a=>a.cards);
          global.CARD_BY_KEY=new Map(ALL_CARDS.map(card=>[card.id,card]));

          // V2.2 auf den echten Basisbestand aufsetzen.
          eval(fs.readFileSync('app/src/main/assets/cards-v22.js','utf8'));

          const after22={hf1:472,hf2:99,hf3:68,aufmass:98,total:737};
          for(const [area,count] of Object.entries(after22)){
            if(area==='total') continue;
            if(AREAS[area].cards.length!==count){
              throw new Error(`V2.2 ${area}: ${AREAS[area].cards.length} statt ${count}`);
            }
          }
          if(ALL_CARDS.length!==after22.total) throw new Error(`V2.2 Gesamtbestand ${ALL_CARDS.length} statt ${after22.total}`);
          if(CARD_BY_KEY.size!==after22.total) throw new Error(`V2.2 ID-Map ${CARD_BY_KEY.size} statt ${after22.total}`);

          // V2.3 ergänzen.
          eval(fs.readFileSync('app/src/main/assets/cards-v23.js','utf8'));

          const expected={hf1:634,hf2:99,hf3:68,aufmass:98,total:899};
          for(const [area,count] of Object.entries(expected)){
            if(area==='total') continue;
            if(AREAS[area].cards.length!==count){
              throw new Error(`V2.3 ${area}: ${AREAS[area].cards.length} statt ${count}`);
            }
          }
          if(ALL_CARDS.length!==expected.total) throw new Error(`V2.3 Gesamtbestand ${ALL_CARDS.length} statt ${expected.total}`);
          if(CARD_BY_KEY.size!==expected.total) throw new Error(`V2.3 ID-Map ${CARD_BY_KEY.size} statt ${expected.total}`);

          // IDs und exakte Fragen doppelt absichern.
          const ids=ALL_CARDS.map(c=>c.id);
          if(new Set(ids).size!==ids.length) throw new Error('Doppelte Karten-ID im Gesamtbestand.');

          const nq=s=>String(s||'').trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ');
          const seenQ=new Map();
          for(const c of ALL_CARDS){
            const q=nq(c.q);
            if(seenQ.has(q)) throw new Error(`Exakte Fragendublette: ${c.id} und ${seenQ.get(q)} – ${c.q}`);
            seenQ.set(q,c.id);
          }

          for(let n=473;n<=634;n++){
            if(!CARD_BY_KEY.has(`hf1:${n}`)) throw new Error(`V2.3-ID fehlt: hf1:${n}`);
          }

          if(!window.__FachteilCardsV22) throw new Error('V2.2-Patchflag fehlt.');
          if(!window.__FachteilCardsV23) throw new Error('V2.3-Patchflag fehlt.');

          console.log('Kartensatz V2.3 OK:', window.__FachteilCardsV23Meta);
          NODE

          node <<'NODE'
          const fs=require('fs');
          global.window=global;
          eval(fs.readFileSync('app/src/main/assets/farbenlehre-trainer-v24.js','utf8'));
          const t=window.FachteilColorTrainerV24;
          if(!t || !t.validation || !t.validation.ok) throw new Error('Farbenlehre-Trainer konnte nicht validiert werden.');
          if(t.exercises.length!==346) throw new Error(`Farbenlehre-Aufgaben: ${t.exercises.length} statt 346`);
          if(t.lessons.length!==59) throw new Error(`Farbenlehre-Lektionen: ${t.lessons.length} statt 59`);
          if(t.blocks.length!==8) throw new Error(`Farbenlehre-Blöcke: ${t.blocks.length} statt 8`);
          if(t.blocks.filter(b=>b.ready).length!==8) throw new Error('Es müssen genau 8 Farbenlehre-Blöcke aktiv sein.');
          if(t.exercises.filter(x=>String(x.lesson||'').startsWith('b3')).length!==48) throw new Error('Block 3 muss genau 48 Aufgaben enthalten.');
          if(t.lessons.filter(x=>x.block===3).length!==8) throw new Error('Block 3 muss genau 8 Lektionen enthalten.');
          if(t.exercises.filter(x=>String(x.lesson||'').startsWith('b4')).length!==48) throw new Error('Block 4 muss genau 48 Aufgaben enthalten.');
          if(t.lessons.filter(x=>x.block===4).length!==8) throw new Error('Block 4 muss genau 8 Lektionen enthalten.');
          if(t.exercises.filter(x=>String(x.lesson||'').startsWith('b5')).length!==48) throw new Error('Block 5 muss genau 48 Aufgaben enthalten.');
          if(t.lessons.filter(x=>x.block===5).length!==8) throw new Error('Block 5 muss genau 8 Lektionen enthalten.');
          if(t.exercises.filter(x=>String(x.lesson||'').startsWith('b6')).length!==48) throw new Error('Block 6 muss genau 48 Aufgaben enthalten.');
          if(t.lessons.filter(x=>x.block===6).length!==8) throw new Error('Block 6 muss genau 8 Lektionen enthalten.');
          if(t.exercises.filter(x=>String(x.lesson||'').startsWith('b7')).length!==48) throw new Error('Block 7 muss genau 48 Aufgaben enthalten.');
          if(t.lessons.filter(x=>x.block===7).length!==8) throw new Error('Block 7 muss genau 8 Lektionen enthalten.');
          if(t.exercises.filter(x=>String(x.lesson||'').startsWith('b8')).length!==48) throw new Error('Block 8 muss genau 48 Aufgaben enthalten.');
          if(t.lessons.filter(x=>x.block===8).length!==8) throw new Error('Block 8 muss genau 8 Lektionen enthalten.');
          if(t.finalTestSize!==32) throw new Error(`Farbenlehre-Gesamttest: ${t.finalTestSize} statt 32 Aufgaben`);
          const ids=t.exercises.map(x=>x.id);
          if(new Set(ids).size!==ids.length) throw new Error('Doppelte Farbenlehre-Aufgaben-ID.');
          const prompts=t.exercises.map(x=>String(x.prompt||'').trim().toLowerCase());
          if(new Set(prompts).size!==prompts.length) throw new Error('Doppelte Farbenlehre-Frage gefunden.');
          for(const x of t.exercises){
            if(!Array.isArray(x.options)||x.options.length!==4||new Set(x.options).size!==4) throw new Error(`Ungültige Antwortoptionen: ${x.id}`);
            if(x.correct<0||x.correct>3) throw new Error(`Ungültiger Lösungsindex: ${x.id}`);
            if(!x.src) throw new Error(`Interne Quelle fehlt: ${x.id}`);
          }
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          if((html.match(/farbenlehre-trainer-v24\.js/g)||[]).length!==1) throw new Error('Farbenlehre-Trainer muss genau einmal in index.html eingebunden sein.');
          if(!html.includes('const BACKUP_VERSION=5;')) throw new Error('Backup-Version 5 fehlt.');
          if(!html.includes('colorTrainerState')||!html.includes('substrateTrainerState')||!html.includes('styleTrainerState')) throw new Error('Trainer-Backup-Integration unvollständig.');
          console.log('Farbenlehre-Trainer V2.6.0 OK:',t.validation);
          NODE


          node <<'NODE'
          const fs=require('fs');
          global.window=global;
          eval(fs.readFileSync('app/src/main/assets/stilkunde-trainer-v25.js','utf8'));
          const t=window.FachteilStyleTrainerV25;
          if(!t || !t.validation || !t.validation.ok) throw new Error('Stilkunde-Trainer konnte nicht validiert werden.');
          if(t.exercises.length!==198) throw new Error(`Stilkunde-Aufgaben: ${t.exercises.length} statt 198`);
          if(t.lessons.length!==30) throw new Error(`Stilkunde-Lektionen: ${t.lessons.length} statt 30`);
          if(t.blocks.length!==6) throw new Error(`Stilkunde-Blöcke: ${t.blocks.length} statt 6`);
          if(t.finalTestSize!==24) throw new Error(`Stilkunde-Gesamttest: ${t.finalTestSize} statt 24`);
          const expected={1:36,2:33,3:33,4:33,5:33,6:30};
          for(const [b,n] of Object.entries(expected)){
            const got=t.exercises.filter(x=>x.block===Number(b)).length;
            if(got!==n) throw new Error(`Stilkunde Block ${b}: ${got} statt ${n} Aufgaben`);
          }
          const ids=t.exercises.map(x=>x.id);
          if(new Set(ids).size!==ids.length) throw new Error('Doppelte Stilkunde-Aufgaben-ID.');
          const norm=s=>String(s||'').trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ');
          const prompts=t.exercises.map(x=>norm(x.prompt));
          if(new Set(prompts).size!==prompts.length) throw new Error('Doppelte Stilkunde-Frage gefunden.');
          for(const x of t.exercises){
            if(!Array.isArray(x.options)||x.options.length!==4||new Set(x.options).size!==4) throw new Error(`Ungültige Stilkunde-Antwortoptionen: ${x.id}`);
            if(x.correct<0||x.correct>3) throw new Error(`Ungültiger Stilkunde-Lösungsindex: ${x.id}`);
            if(!x.src) throw new Error(`Stilkunde-Quelle fehlt: ${x.id}`);
            if(x.image && !String(x.image).startsWith('stilkunde-img/')) throw new Error(`Ungültiger Stilkunde-Bildschlüssel: ${x.id}`);
          }
          if(t.validation.imageExerciseCount!==30) throw new Error(`Stilkunde-Bildaufgaben: ${t.validation.imageExerciseCount} statt 30`);

          // Gegen den echten 899er-Kartenbestand auf wortgleiche Fragen prüfen.
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          const match=html.match(/const AREAS=(\{[\s\S]*?\});\s*let currentArea=/);
          if(!match) throw new Error('AREAS-Basisdaten für Stilkunde-Dublettentest fehlen.');
          global.AREAS=JSON.parse(match[1]);
          Object.entries(AREAS).forEach(([area,data])=>data.cards.forEach(card=>card._area=area));
          global.ALL_CARDS=Object.values(AREAS).flatMap(a=>a.cards);
          global.CARD_BY_KEY=new Map(ALL_CARDS.map(card=>[card.id,card]));
          eval(fs.readFileSync('app/src/main/assets/cards-v22.js','utf8'));
          eval(fs.readFileSync('app/src/main/assets/cards-v23.js','utf8'));
          if(ALL_CARDS.length!==899) throw new Error(`Stilkunde-Dublettentest: ${ALL_CARDS.length} Karten statt 899`);
          const normalQ=new Map(ALL_CARDS.map(c=>[norm(c.q),c.id]));
          const dup=t.exercises.filter(x=>normalQ.has(norm(x.prompt)));
          if(dup.length) throw new Error('Wortgleiche Stilkunde-Frage zu normaler Lernkarte: '+dup.map(x=>`${x.id}/${normalQ.get(norm(x.prompt))}`).join(', '));

          if((html.match(/stilkunde-trainer-v25\.js/g)||[]).length!==1) throw new Error('Stilkunde-Trainer muss genau einmal in index.html eingebunden sein.');
          if(!html.includes('const BACKUP_VERSION=5;')) throw new Error('Backup-Version 5 fehlt.');
          if(!html.includes('styleTrainerState')||!html.includes('fachteil_style_trainer_v25')) throw new Error('Stilkunde-Backup/Reset-Integration unvollständig.');
          console.log('Stilkunde-Trainer V2.6.0 OK:',t.validation);
          NODE

      - name: V2.6.0 Integritaet, Startseite und Cleanup pruefen
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          if(!html.includes("'fachteil_smart_v18_session'")) throw new Error('Smart-Learning-Restschluessel fehlt im Komplettreset.');
          if(!html.includes("else if(typeof window.FachteilStyleTrainerV25.clearState==='function')window.FachteilStyleTrainerV25.clearState()")) throw new Error('Backup-Ersetzlogik fuer fehlenden Stilkunde-Stand fehlt.');
          if(/Unterrichtsstand 2012/i.test(html)) throw new Error('Sichtbarer Unterrichtsstand 2012 ist noch enthalten.');

          const m=html.match(/const AREAS=(\{[\s\S]*?\});\s*let currentArea=/); if(!m) throw new Error('AREAS fehlt');
          global.window=global; global.AREAS=JSON.parse(m[1]); Object.entries(AREAS).forEach(([k,a])=>a.cards.forEach(c=>c._area=k)); global.ALL_CARDS=Object.values(AREAS).flatMap(a=>a.cards); global.CARD_BY_KEY=new Map(ALL_CARDS.map(c=>[c.id,c]));
          eval(fs.readFileSync('app/src/main/assets/cards-v22.js','utf8')); eval(fs.readFileSync('app/src/main/assets/cards-v23.js','utf8'));
          if(ALL_CARDS.length!==899) throw new Error('899 Karten nicht erhalten.');
          const c523=CARD_BY_KEY.get('hf1:523'); if(!/obersten zwei Stufen/i.test(c523.a)) throw new Error('Stehleiter-Karte nicht aktualisiert.');
          const c593=CARD_BY_KEY.get('hf1:593'),c603=CARD_BY_KEY.get('hf1:603'); if(!/Gruppe 4/i.test(c593.a)||!/1 zu 4/i.test(c603.a)) throw new Error('BFS 26 Vier-Gruppen-System fehlt in Karten.');

          const visibleCardText=ALL_CARDS.map(c=>[c.q,c.a,...(c.distractors||[])].join(' ')).join('\n');
          const bad=/(?:Dino|Lösungsbogen|Unterrichtsunterlag|Unterrichtsstand|Physik-Arbeitsblatt|im Arbeitsblatt|laut BFS-\d+-Unterlagen|der Unterlagen)/i;
          if(bad.test(visibleCardText)) throw new Error('Interne Quellenformulierung ist noch in sichtbaren Lernkarten enthalten.');

          global.document={getElementById(){return null},querySelector(){return null},createElement(){return {style:{},classList:{add(){},remove(){},contains(){return false}},appendChild(){},setAttribute(){}}},head:{appendChild(){}},body:{appendChild(){}},readyState:'loading',addEventListener(){}};
          global.localStorage={getItem(){return null},setItem(){},removeItem(){}}; global.setInterval=()=>0; global.clearInterval=()=>{};
          eval(fs.readFileSync('app/src/main/assets/untergrund-trainer-v21.js','utf8'));
          const u=window.FachteilSubstrateTrainerV21; if(!u||u.stages.length!==7||u.stages.filter(s=>s.ready).length!==7) throw new Error('Untergrundtrainer nicht 7/7 aktiv.');
          const pools=u.stages.reduce((n,s)=>n+(Array.isArray(s.pool)?s.pool.length:0),0); if(pools!==150) throw new Error(`Untergrundtrainer ${pools} statt 150 Poolfragen.`);
          for(const s of u.stages){if(!Array.isArray(s.pool)||s.pool.length<20) throw new Error(`Untergrund Stufe ${s.id}: zu kleiner Pool`);for(const x of s.pool){if(!Array.isArray(x.options)||x.options.length!==4||new Set(x.options).size!==4) throw new Error(`Untergrund Optionen ${x.id}`);}}

          eval(fs.readFileSync('app/src/main/assets/farbenlehre-trainer-v24.js','utf8'));
          const col=window.FachteilColorTrainerV24; const b8=col.exercises.filter(x=>x.lesson==='b8l8'); if(b8.length!==6||!b8.some(x=>/1 bis 4/.test(x.prompt))) throw new Error('BFS 26 Update im Farbenlehre-Trainer fehlt.');
          const visColor=col.exercises.map(x=>[x.prompt,...x.options,x.why].join(' ')).join('\n');
          const visStyle=(window.FachteilStyleTrainerV25?window.FachteilStyleTrainerV25.exercises:[]).map(x=>[x.prompt,...x.options,x.why].join(' ')).join('\n');
          if(/Dino|Lösungsbogen|Unterrichtsunterlag|Unterrichtsgrafik|im Arbeitsblatt|aus dem Arbeitsblatt/i.test(visColor)) throw new Error('Interne Quellenformulierung im Farbenlehre-Quiz.');
          // Stilkunde wird im normalen V2.5.0-Block bereits separat evaluiert; hier wird die Datei statisch geprüft.
          const styleJs=fs.readFileSync('app/src/main/assets/stilkunde-trainer-v25.js','utf8'); if(/im Arbeitsblatt bezeichnet|Lösungsbogen nennt|Unterrichtsgrafik bezeichnet/i.test(styleJs)) throw new Error('Interne Quellenformulierung im Stilkunde-Trainer.');
          console.log('V2.6.0 Integritaet statisch OK.');
          NODE

      - name: Script-Reihenfolge und Cleanup-Dateien pruefen
        shell: bash
        run: |
          test ! -f app/src/main/build.gradle || { echo "Veraltete Datei app/src/main/build.gradle ist noch vorhanden."; exit 1; }
          test ! -f app/src/main/assets/bindemittel-trainer-v201-patch.js || { echo "Nicht mehr geladener Bindemittel-Patch ist noch vorhanden."; exit 1; }
          grep -q "versionCode 29" app/build.gradle || { echo "versionCode 29 fehlt"; exit 1; }
          grep -q "versionName '2.6.0'" app/build.gradle || { echo "versionName 2.6.0 fehlt"; exit 1; }

          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          const order=[
            'cards-v22.js','cards-v23.js','analysis-v12.js','analysis-v121-mobile.js',
            'exam-v13.js','exam-analysis-v14.js','readiness-v15.js','home-redesign-v17.js',
            'bindemittel-trainer-v20.js','untergrund-trainer-v21.js','farbenlehre-trainer-v24.js','stilkunde-trainer-v25.js'
          ];
          let last=-1;
          for(const name of order){
            const tag=`<script src="${name}"></script>`;
            const count=(html.match(new RegExp(tag.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;
            if(count!==1) throw new Error(`${name}: Script-Tag ${count}x statt genau einmal.`);
            const pos=html.indexOf(tag);
            if(pos<=last) throw new Error(`Falsche Script-Reihenfolge bei ${name}.`);
            last=pos;
          }
          if(/bindemittel-trainer-v201-patch\.js/.test(html)) throw new Error('Toter V2.0.1-Patch ist noch in index.html referenziert.');

          const home=fs.readFileSync('app/src/main/assets/home-redesign-v17.js','utf8');
          for(const marker of ['window.FachteilHomeV26','v26TrainerHub','v26LearningHub','Loslegen','Werkzeuge']){
            if(!home.includes(marker)) throw new Error(`V2.6-Startseitenmarker fehlt: ${marker}`);
          }
          console.log('Script-Reihenfolge und V2.6-Cleanup OK.');
          NODE

      - name: Signatur-Secrets prüfen
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD fehlt"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS fehlt"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD fehlt"; exit 1; }

      - name: Festen Signierschlüssel bereitstellen
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/fachteil-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fachteil-signing/fachteil-luchs-release.jks"

      - name: Signierte Release-APK bauen
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fachteil-signing/fachteil-luchs-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: APK sinnvoll benennen
        run: cp app/build/outputs/apk/release/app-release.apk Fachteil-Luchs-V2.6.0-SIGNED.apk

      - name: APK-Signatur prüfen
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "apksigner nicht gefunden"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs Fachteil-Luchs-V2.6.0-SIGNED.apk

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Fachteil-Luchs-V2.6.0-SIGNED-APK
          path: Fachteil-Luchs-V2.6.0-SIGNED.apk
          if-no-files-found: error
