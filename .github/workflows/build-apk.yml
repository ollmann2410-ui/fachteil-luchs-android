name: Build Fachteil-Luchs APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: V2.4.3 App und Kartensatz technisch pruefen
        shell: bash
        run: |
          node --check app/src/main/assets/cards-v22.js
          node --check app/src/main/assets/cards-v23.js
          node --check app/src/main/assets/exam-v13.js
          node --check app/src/main/assets/farbenlehre-trainer-v24.js

          node <<'NODE'
          const fs=require('fs');
          global.window=global;

          // Echte Basisdaten direkt aus index.html lesen.
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          const match=html.match(/const AREAS=(\{[\s\S]*?\});\s*let currentArea=/);
          if(!match) throw new Error('AREAS-Basisdaten in index.html nicht gefunden.');

          global.AREAS=JSON.parse(match[1]);
          Object.entries(AREAS).forEach(([area,data])=>{
            data.cards.forEach(card=>card._area=area);
          });

          global.ALL_CARDS=Object.values(AREAS).flatMap(a=>a.cards);
          global.CARD_BY_KEY=new Map(ALL_CARDS.map(card=>[card.id,card]));

          // V2.2 auf den echten Basisbestand aufsetzen.
          eval(fs.readFileSync('app/src/main/assets/cards-v22.js','utf8'));

          const after22={hf1:472,hf2:99,hf3:68,aufmass:98,total:737};
          for(const [area,count] of Object.entries(after22)){
            if(area==='total') continue;
            if(AREAS[area].cards.length!==count){
              throw new Error(`V2.2 ${area}: ${AREAS[area].cards.length} statt ${count}`);
            }
          }
          if(ALL_CARDS.length!==after22.total) throw new Error(`V2.2 Gesamtbestand ${ALL_CARDS.length} statt ${after22.total}`);
          if(CARD_BY_KEY.size!==after22.total) throw new Error(`V2.2 ID-Map ${CARD_BY_KEY.size} statt ${after22.total}`);

          // V2.3 ergänzen.
          eval(fs.readFileSync('app/src/main/assets/cards-v23.js','utf8'));

          const expected={hf1:634,hf2:99,hf3:68,aufmass:98,total:899};
          for(const [area,count] of Object.entries(expected)){
            if(area==='total') continue;
            if(AREAS[area].cards.length!==count){
              throw new Error(`V2.3 ${area}: ${AREAS[area].cards.length} statt ${count}`);
            }
          }
          if(ALL_CARDS.length!==expected.total) throw new Error(`V2.3 Gesamtbestand ${ALL_CARDS.length} statt ${expected.total}`);
          if(CARD_BY_KEY.size!==expected.total) throw new Error(`V2.3 ID-Map ${CARD_BY_KEY.size} statt ${expected.total}`);

          // IDs und exakte Fragen doppelt absichern.
          const ids=ALL_CARDS.map(c=>c.id);
          if(new Set(ids).size!==ids.length) throw new Error('Doppelte Karten-ID im Gesamtbestand.');

          const nq=s=>String(s||'').trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ');
          const seenQ=new Map();
          for(const c of ALL_CARDS){
            const q=nq(c.q);
            if(seenQ.has(q)) throw new Error(`Exakte Fragendublette: ${c.id} und ${seenQ.get(q)} – ${c.q}`);
            seenQ.set(q,c.id);
          }

          for(let n=473;n<=634;n++){
            if(!CARD_BY_KEY.has(`hf1:${n}`)) throw new Error(`V2.3-ID fehlt: hf1:${n}`);
          }

          if(!window.__FachteilCardsV22) throw new Error('V2.2-Patchflag fehlt.');
          if(!window.__FachteilCardsV23) throw new Error('V2.3-Patchflag fehlt.');

          console.log('Kartensatz V2.3 OK:', window.__FachteilCardsV23Meta);
          NODE

          node <<'NODE'
          const fs=require('fs');
          global.window=global;
          eval(fs.readFileSync('app/src/main/assets/farbenlehre-trainer-v24.js','utf8'));
          const t=window.FachteilColorTrainerV24;
          if(!t || !t.validation || !t.validation.ok) throw new Error('Farbenlehre-Trainer konnte nicht validiert werden.');
          if(t.exercises.length!==202) throw new Error(`Farbenlehre-Aufgaben: ${t.exercises.length} statt 202`);
          if(t.lessons.length!==35) throw new Error(`Farbenlehre-Lektionen: ${t.lessons.length} statt 35`);
          if(t.blocks.length!==8) throw new Error(`Farbenlehre-Blöcke: ${t.blocks.length} statt 8`);
          if(t.blocks.filter(b=>b.ready).length!==5) throw new Error('Es müssen genau 5 Farbenlehre-Blöcke aktiv sein.');
          if(t.exercises.filter(x=>String(x.lesson||'').startsWith('b3')).length!==48) throw new Error('Block 3 muss genau 48 Aufgaben enthalten.');
          if(t.lessons.filter(x=>x.block===3).length!==8) throw new Error('Block 3 muss genau 8 Lektionen enthalten.');
          if(t.exercises.filter(x=>String(x.lesson||'').startsWith('b4')).length!==48) throw new Error('Block 4 muss genau 48 Aufgaben enthalten.');
          if(t.lessons.filter(x=>x.block===4).length!==8) throw new Error('Block 4 muss genau 8 Lektionen enthalten.');
          if(t.exercises.filter(x=>String(x.lesson||'').startsWith('b5')).length!==48) throw new Error('Block 5 muss genau 48 Aufgaben enthalten.');
          if(t.lessons.filter(x=>x.block===5).length!==8) throw new Error('Block 5 muss genau 8 Lektionen enthalten.');
          const ids=t.exercises.map(x=>x.id);
          if(new Set(ids).size!==ids.length) throw new Error('Doppelte Farbenlehre-Aufgaben-ID.');
          const prompts=t.exercises.map(x=>String(x.prompt||'').trim().toLowerCase());
          if(new Set(prompts).size!==prompts.length) throw new Error('Doppelte Farbenlehre-Frage gefunden.');
          for(const x of t.exercises){
            if(!Array.isArray(x.options)||x.options.length!==4||new Set(x.options).size!==4) throw new Error(`Ungültige Antwortoptionen: ${x.id}`);
            if(x.correct<0||x.correct>3) throw new Error(`Ungültiger Lösungsindex: ${x.id}`);
            if(!x.src) throw new Error(`Interne Quelle fehlt: ${x.id}`);
          }
          const html=fs.readFileSync('app/src/main/assets/index.html','utf8');
          if((html.match(/farbenlehre-trainer-v24\.js/g)||[]).length!==1) throw new Error('Farbenlehre-Trainer muss genau einmal in index.html eingebunden sein.');
          if(!html.includes('const BACKUP_VERSION=4;')) throw new Error('Backup-Version 4 fehlt.');
          if(!html.includes('colorTrainerState')||!html.includes('substrateTrainerState')) throw new Error('Trainer-Backup-Integration unvollständig.');
          console.log('Farbenlehre-Trainer V2.4.3 OK:',t.validation);
          NODE

      - name: V2.2 und V2.3 vor Analysemodulen einbinden
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')

          needle='<script src="analysis-v12.js"></script>'
          tag22='<script src="cards-v22.js"></script>'
          tag23='<script src="cards-v23.js"></script>'

          if tag22 in s or tag23 in s:
              raise SystemExit('Karten-Patch ist bereits in index.html eingebunden; Build abgebrochen, um Doppelimport zu verhindern.')
          if needle not in s:
              raise SystemExit('Einbindepunkt analysis-v12.js nicht gefunden.')

          block=tag22+'\n'+tag23+'\n'+needle
          s=s.replace(needle, block, 1)
          p.write_text(s, encoding='utf-8')

          if not (s.index(tag22) < s.index(tag23) < s.index(needle)):
              raise SystemExit('Falsche Script-Reihenfolge.')

          print('cards-v22.js -> cards-v23.js -> analysis-v12.js wird geladen.')
          PY

      - name: Signatur-Secrets prüfen
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD fehlt"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS fehlt"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD fehlt"; exit 1; }

      - name: Festen Signierschlüssel bereitstellen
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/fachteil-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fachteil-signing/fachteil-luchs-release.jks"

      - name: Signierte Release-APK bauen
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fachteil-signing/fachteil-luchs-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: APK sinnvoll benennen
        run: cp app/build/outputs/apk/release/app-release.apk Fachteil-Luchs-V2.4.3-SIGNED.apk

      - name: APK-Signatur prüfen
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "apksigner nicht gefunden"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs Fachteil-Luchs-V2.4.3-SIGNED.apk

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Fachteil-Luchs-V2.4.3-SIGNED-APK
          path: Fachteil-Luchs-V2.4.3-SIGNED.apk
          if-no-files-found: error
